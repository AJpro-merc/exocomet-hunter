# Scheduled exocomet survey.
#
# TESS is still observing, so new sectors keep appearing in the archive. This
# workflow wakes up weekly on GitHub's machines, asks whether any watchlist star
# has new data, runs the pipeline over whatever is new, and commits the results
# back to the repository. It needs nothing running locally.
#
# Free for public repositories. Each run is capped well under the job limit by
# processing at most a handful of targets, and light curves are streamed and
# discarded rather than stored.

name: survey

on:
  schedule:
    # 05:00 UTC daily.
    #
    # TESS sector data reaches the archive roughly monthly, so most runs will
    # find nothing. That is fine and intended: asking the archive "is anything
    # new?" costs seconds, while downloading and processing only happens when
    # the answer is yes. Checking daily therefore costs almost nothing and
    # catches new data up to a month sooner than a monthly check would.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum targets to process this run"
        required: false
        default: "5"
      dry_run:
        description: "Only report what has new data"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run survey
        run: |
          python scripts/monitor_new_data.py \
            --watchlist config/watchlist.txt \
            --mission TESS \
            --limit "${{ github.event.inputs.limit || 5 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Survey run $(date -u +%Y-%m-%d)"
            if [ -f results/monitor_candidates.jsonl ]; then
              echo "Total flagged candidates on record: $(wc -l < results/monitor_candidates.jsonl)"
            else
              echo "No candidates file yet."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/processed_ledger.json results/monitor_candidates.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new results to commit."
          else
            git commit -m "survey: automated run $(date -u +%Y-%m-%d)"
            git push
          fi
