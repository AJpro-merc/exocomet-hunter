# Machine-readable mirror of 43_scientific_claims_registry.md.
#
# Status vocabulary (strict — no other values allowed):
#   IMPLEMENTED, TESTED, VALIDATED, OPERATIONAL, PARTIAL, PLANNED, BLOCKED,
#   DEPRECATED, UNKNOWN, NOT IMPLEMENTED, UNVERIFIED
#
# "The code exists" (IMPLEMENTED) and "the scientific claim is validated"
# (VALIDATED) are different things and must never be conflated. `evidence`
# entries are structured (source_type + source), not bare path strings, so a
# future script can distinguish a test result from a doc reference from a
# session-log narrative. `revalidation_required: true` marks a claim whose
# supporting evidence predates a later code change and has not been re-run
# since — this is the field a rollup pass should scan first.
#
# Generated: 2026-09-16, against commit 01c2051.

